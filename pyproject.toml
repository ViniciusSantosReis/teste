[project]
name = "intranet-decos-api"
version = "0.1.0"
description = "API da Intranet Hospitalar Decós Corporativa"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "oracledb>=2.4",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "pillow>=10.4",
    "python-magic>=0.4.27",
    "redis>=5.1",
    "apscheduler>=3.10",
    "sqladmin>=0.19",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.17",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "T20", "ASYNC", "S"]
# T20 barra print(); use log.info(). S = bandit.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]          # assert é esperado em teste
"alembic/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "magic.*", "sqladmin.*", "apscheduler.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.report]
# O piso de 60% vale sobre os services (ver CI).
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
